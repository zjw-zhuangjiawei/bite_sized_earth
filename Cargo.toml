[package]
name = "bite_sized_earth"
version = "0.1.0"
authors = ["Zhuang Jiawei <zjw@stu.scau.edu.cn>"]
edition = "2024"


[workspace]
resolver = "3"
members = ["crates/bse_core", "crates/bse_logic", "crates/bse_shell"]

[workspace.dependencies]
bevy = { version = "0.18" }
bse_core = { path = "crates/bse_core" }
bse_logic = { path = "crates/bse_logic" }
bse_shell = { path = "crates/bse_shell" }

[dependencies]
bevy = { workspace = true }
bse_core = { workspace = true }
bse_logic = { workspace = true }
bse_shell = { workspace = true }
