[package]
name = "bite_sized_earth"
version = "0.1.0"
authors = ["Zhuang Jiawei <zjw@stu.scau.edu.cn>"]
edition = "2024"

[features]
dev = ["dep:dot-vox"]

[dependencies]
bevy = { version = "0.18" }
bevy_egui = "0.39"
bevy_enhanced_input = "0.25"
bevy_asset = { version = "0.18" }
bevy_image = { version = "0.18" }
bevy_mesh = { version = "0.18" }
bevy_pbr = { version = "0.18" }
bevy_render = { version = "0.18" }
pathfinding = "4.15"
smallvec = "1.15"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
thiserror = "2"
dot-vox = { version = "5", optional = true, package = "dot_vox" }

[[bin]]
name = "convert-vox"
path = "src/bin/convert_vox.rs"
required-features = ["dev"]
